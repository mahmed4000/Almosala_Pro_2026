name: Build iOS IPA (For Sideloadly)

on:
  push:
    branches: [ main, ios-build ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ios-build

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🍫 Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: 🔨 Compile iOS App (arm64 for Physical Devices)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | jq -r '.workspace.schemes[0]')
          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Package into IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app binary at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y almosala-pro.ipa Payload
          cd ..
          ls -lh build/almosala-pro.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almosala-pro-ios-ipa
          path: build/almosala-pro.ipa
          if-no-files-found: error
          retention-days: 7
